name: Test Suite

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - run: npm ci
      
      - name: Run TypeScript check
        run: npx tsc --noEmit --strict
      
      - name: Run tests (parallel)
        run: npm test -- --run --reporter=verbose
        env:
          CI: true
