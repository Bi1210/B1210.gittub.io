


<!DOCTYPE html>
<html lang="zh-CN" translate="no">
  <head>
    <meta charset="utf-8" />
    <!-- 关掉浏览器自动翻译：SullyOS 本身就是中文 App，翻译纯属添乱（甚至「中译中」），
         还会改动 React 托管的 DOM 触发 insertBefore/removeChild 白屏。translate="no" + 这两个 meta
         覆盖 Chrome/Edge/三星 等主流浏览器。utils/translateCrashGuard 作为兜底护栏仍保留。 -->
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>SullyOS</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SullyOS" />
    
    <!-- Updated Icons -->
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />

    <!-- KaTeX CSS for Math Rendering -->
    <link rel="stylesheet" href="https://unpkg.com/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600&family=Nunito:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700;900&family=DM+Serif+Display:ital@0;1&family=Caveat:wght@400;500;600;700&family=Shippori+Mincho:wght@400;500;600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Ma+Shan+Zheng&family=Long+Cang&family=ZCOOL+KuaiLe&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['var(--app-font)', 'sans-serif'],
            },
            colors: {
              primary: 'hsl(var(--primary-hue), var(--primary-sat), var(--primary-lightness))', 
              'primary-focus': 'hsl(var(--primary-hue), var(--primary-sat), calc(var(--primary-lightness) - 10%))',
              'primary-light': 'hsl(var(--primary-hue), var(--primary-sat), 92%)',
              surface: 'rgba(255, 255, 255, 0.75)',
              'surface-glass': 'rgba(255, 255, 255, 0.35)',
            },
            animation: {
              'fade-in': 'fadeIn 0.35s cubic-bezier(0.4, 0, 0.2, 1)',
              'slide-up': 'slideUp 0.35s cubic-bezier(0.25, 1, 0.5, 1)',
              'slide-down': 'slideDown 0.35s cubic-bezier(0.25, 1, 0.5, 1)',
              'pop-in': 'popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
              'float-up': 'floatUp 3s ease-out forwards',
              'wiggle': 'wiggle 0.5s ease-in-out infinite',
              'bounce-slow': 'bounceSlow 2s ease-in-out infinite',
              'float': 'floatDrift 4s ease-in-out infinite alternate',
              'glow-pulse': 'glowPulse 3s ease-in-out infinite',
              'shimmer': 'shimmer 2.5s ease-in-out infinite',
              'dot-pulse': 'dotPulse 1.2s ease-in-out infinite',
              'app-open': 'appOpen 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
              'notif-pop': 'notifPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'scale(0.97) translateY(4px)' },
                '100%': { opacity: '1', transform: 'scale(1) translateY(0)' },
              },
              slideUp: {
                '0%': { transform: 'translateY(100%)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              slideDown: {
                '0%': { transform: 'translateY(-100%)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              popIn: {
                '0%': { opacity: '0', transform: 'scale(0.5)' },
                '60%': { transform: 'scale(1.05)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              floatUp: {
                '0%': { opacity: '1', transform: 'translateY(100vh) scale(1)' },
                '50%': { opacity: '1' },
                '100%': { opacity: '0', transform: 'translateY(-50px) scale(1.5)' },
              },
              wiggle: {
                '0%, 100%': { transform: 'translate(-50%, -100%) rotate(-3deg)' },
                '50%': { transform: 'translate(-50%, -100%) rotate(3deg)' },
              },
              bounceSlow: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              floatDrift: {
                '0%': { transform: 'translateY(0) scale(1)', opacity: '0.3' },
                '100%': { transform: 'translateY(-30px) scale(1.1)', opacity: '0.6' },
              },
              glowPulse: {
                '0%, 100%': { boxShadow: '0 0 15px rgba(139, 92, 246, 0.15)' },
                '50%': { boxShadow: '0 0 25px rgba(139, 92, 246, 0.3)' },
              },
              shimmer: {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              },
              dotPulse: {
                '0%, 80%, 100%': { opacity: '0.3', transform: 'scale(0.8)' },
                '40%': { opacity: '1', transform: 'scale(1.1)' },
              },
              appOpen: {
                '0%': { opacity: '0', transform: 'translateY(8%) scale(0.95)' },
                '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
              },
              notifPop: {
                '0%': { opacity: '0', transform: 'translateY(-130%)' },
                '70%': { opacity: '1', transform: 'translateY(6%)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --primary-hue: 245; 
        --primary-sat: 25%;
        --primary-lightness: 65%;
        /* 安全区单一来源：原生 env 与 JS 探测值 --standalone-safe-area-*（见 utils/iosStandalone.ts）取大，
           iOS 全屏 PWA 下原生 env 偶发返回 0 时由探测值兜底。新增 App 一律引用这三个变量。 */
        --safe-top: max(env(safe-area-inset-top, 0px), var(--standalone-safe-area-top, 0px));
        --safe-bottom: max(env(safe-area-inset-bottom, 0px), var(--standalone-safe-area-bottom, 0px));
        /* 全屏界面顶栏让开「安全区 + SullyOS 顶部状态栏(时间/电量, 约 1.5rem)」；背景仍铺满，只挪控件。 */
        --chrome-top: calc(var(--safe-top) + 1.5rem);
        --app-height: 100lvh;
        --keyboard-inset: 0px;
        --app-font: 'Quicksand', sans-serif;
      }
      /* 动森风格皮肤：拉丁/数字用 Nunito（圆润），中文用 ZCOOL KuaiLe（可爱），保留 Noto Sans SC 兜底。
         选择 html[data-skin] 而非 :root，优先级更高，能盖过运行时注入的 --app-font。 */
      html[data-skin="animalcrossing"] {
        --app-font: 'Nunito', 'ZCOOL KuaiLe', 'Noto Sans SC', sans-serif;
      }
      /* ============================================================
         液态玻璃皮肤（iOS 26 Liquid Glass 视觉模拟）
         CSS 无法接入系统原生渲染管线，这里用 backdrop-filter + 分层高光
         + 交互态形变去逼近质感；用 --lg- 前缀变量集中管理，方便统一调参。
         ============================================================ */
      html[data-skin="liquidglass"] {
        /* 项目没有全局深色模式开关，液态玻璃皮肤直接以深色玻璃为默认视觉——
           iOS 26 系统本身在深色壁纸下的呈现也更接近这种通透氛围光效果。 */
        --app-font: -apple-system, 'SF Pro Text', 'SF Pro Display', 'PingFang SC', 'Helvetica Neue', sans-serif;
        --lg-tint: 44, 44, 46;
        --lg-blur: 28px;
        --lg-saturate: 180%;
        --lg-border: rgba(255, 255, 255, 0.16);
        --lg-highlight: rgba(255, 255, 255, 0.22);
        --lg-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        color-scheme: dark;
      }
      /* 玻璃卡片内的正文文字：深色玻璃底下需要浅色文字才可读，供聊天/弹窗类容器按需引用。 */
      html[data-skin="liquidglass"] .sully-lg-text {
        color: rgba(255, 255, 255, 0.92);
      }
      html[data-skin="liquidglass"] .sully-lg-text-muted {
        color: rgba(255, 255, 255, 0.55);
      }
      /* 基础玻璃材质：任意元素挂 .sully-lg-surface 即获得毛玻璃质感。
         用 rgba(--lg-tint) 而非纯色，保证背景色随浅/深色变量联动，不用另开一套深色规则。 */
      html[data-skin="liquidglass"] .sully-lg-surface {
        position: relative;
        background: rgba(var(--lg-tint), 0.55);
        -webkit-backdrop-filter: blur(var(--lg-blur)) saturate(var(--lg-saturate));
        backdrop-filter: blur(var(--lg-blur)) saturate(var(--lg-saturate));
        border: 1px solid var(--lg-border);
        box-shadow: var(--lg-shadow);
        transition: background 0.25s ease, box-shadow 0.25s ease, transform 0.25s cubic-bezier(0.25, 1, 0.5, 1);
      }
      /* 顶部边缘高光：模拟玻璃表面的环境光反射，只在上边缘出现一道柔光，不做满铺，避免糊成一片。 */
      html[data-skin="liquidglass"] .sully-lg-surface::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(180deg, var(--lg-highlight) 0%, transparent 40%);
        opacity: 0.5;
        pointer-events: none;
      }
      /* 按下态：表面凹陷 + 高光聚拢，而不是简单变暗，模拟软质玻璃被按压的触感。 */
      html[data-skin="liquidglass"] .sully-lg-surface:active,
      html[data-skin="liquidglass"] .sully-lg-pressable:active {
        transform: scale(0.97);
        box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      }
      /* 圆形玻璃控件（Dock 图标底、按钮）：比方形面板多一层更强的顶部高光，贴近液态珠子质感。 */
      html[data-skin="liquidglass"] .sully-lg-pill {
        background: rgba(var(--lg-tint), 0.5);
        -webkit-backdrop-filter: blur(var(--lg-blur)) saturate(var(--lg-saturate));
        backdrop-filter: blur(var(--lg-blur)) saturate(var(--lg-saturate));
        border: 1px solid var(--lg-border);
        box-shadow: var(--lg-shadow);
        transition: transform 0.35s cubic-bezier(0.34, 1.4, 0.4, 1), box-shadow 0.35s ease;
      }
      /* 滚动收缩形变：由 JS（utils/liquidGlassScroll）根据滚动方向/速度切换这个类，
         CSS 只负责过渡曲线——用「快加速、慢收尾」的贝塞尔曲线模拟液体阻尼感。 */
      html[data-skin="liquidglass"] .sully-lg-chrome {
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-radius 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }
      html[data-skin="liquidglass"] .sully-lg-chrome.sully-lg-shrink {
        transform: scale(0.92);
        opacity: 0.72;
      }
      /* 触摸跟随高光：JS 实时写 --lg-pointer-x/y（0~100%），做出"手指划到哪、反光跟到哪"的效果。 */
      html[data-skin="liquidglass"] .sully-lg-glow {
        position: relative;
        overflow: hidden;
      }
      html[data-skin="liquidglass"] .sully-lg-glow::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: radial-gradient(120px circle at var(--lg-pointer-x, 50%) var(--lg-pointer-y, 50%), rgba(255, 255, 255, 0.35), transparent 70%);
        opacity: 0;
        transition: opacity 0.2s ease;
        pointer-events: none;
      }
      html[data-skin="liquidglass"] .sully-lg-glow.sully-lg-glow-active::after {
        opacity: 1;
      }
      /* 原位展开动效：弹窗/菜单出现时从触发点“漫开”，而非从屏幕中心弹出。
         JS 在打开前把 --lg-origin-x/y 设为触发元素坐标，这里只消费变量做 transform-origin。 */
      html[data-skin="liquidglass"] .sully-lg-modal {
        transform-origin: var(--lg-origin-x, 50%) var(--lg-origin-y, 50%);
        animation: sullyLgExpand 0.38s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      @keyframes sullyLgExpand {
        from { opacity: 0; transform: scale(0.85); }
        to { opacity: 1; transform: scale(1); }
      }
      /* 图标基底：低饱和半透明玻璃 + 单一顶部高光，取消描边与厚重投影，贴近 iOS 26 图标规范。 */
      html[data-skin="liquidglass"] .sully-lg-icon {
        background: rgba(var(--lg-tint), 0.65);
        -webkit-backdrop-filter: blur(12px) saturate(160%);
        backdrop-filter: blur(12px) saturate(160%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 2px 10px rgba(0, 0, 0, 0.08);
      }
      html[data-skin="liquidglass"] .sully-liquidglass-backdrop {
        background: rgba(10, 11, 18, 0.18);
        -webkit-backdrop-filter: blur(2px) saturate(120%);
        backdrop-filter: blur(2px) saturate(120%);
      }
      /* 应用自身内容层仍由各 App 控制背景；只让壁纸在 Chrome 缝隙透出，不给正文统一加玻璃。 */

      html[data-skin="liquidglass"] .sully-liquidglass-shell {
        color: rgba(255, 255, 255, 0.94);
      }
      html[data-skin="liquidglass"] .sully-liquidglass-settings {
        background: transparent !important;
        color: rgba(255, 255, 255, 0.92);
      }
      html[data-skin="liquidglass"] .sully-liquidglass-settings > div:first-child,
      html[data-skin="liquidglass"] .sully-liquidglass-settings > div:nth-child(2) {
        background: rgba(var(--lg-tint), 0.46) !important;
        -webkit-backdrop-filter: blur(24px) saturate(170%);
        backdrop-filter: blur(24px) saturate(170%);
        border-color: var(--lg-border) !important;
      }
      html[data-skin="liquidglass"] .sully-liquidglass-settings section {
        background: rgba(var(--lg-tint), 0.42) !important;
        border-color: rgba(255, 255, 255, 0.13) !important;
        box-shadow: 0 8px 26px rgba(0, 0, 0, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        -webkit-backdrop-filter: blur(20px) saturate(160%);
        backdrop-filter: blur(20px) saturate(160%);
      }
      html[data-skin="liquidglass"] .sully-liquidglass-settings h1,
      html[data-skin="liquidglass"] .sully-liquidglass-settings h2,
      html[data-skin="liquidglass"] .sully-liquidglass-settings h3,
      html[data-skin="liquidglass"] .sully-liquidglass-settings span,
      html[data-skin="liquidglass"] .sully-liquidglass-settings label {
        color: rgba(255, 255, 255, 0.88);
      }
      html[data-skin="liquidglass"] .sully-liquidglass-settings p,
      html[data-skin="liquidglass"] .sully-liquidglass-settings .text-slate-400,
      html[data-skin="liquidglass"] .sully-liquidglass-settings .text-slate-500 {
        color: rgba(255, 255, 255, 0.58) !important;
      }
      html[data-skin="liquidglass"] .sully-liquidglass-settings input,
      html[data-skin="liquidglass"] .sully-liquidglass-settings textarea,
      html[data-skin="liquidglass"] .sully-liquidglass-settings select {
        background: rgba(255, 255, 255, 0.10) !important;
        color: rgba(255, 255, 255, 0.92) !important;
        border-color: rgba(255, 255, 255, 0.18) !important;
        -webkit-backdrop-filter: blur(16px) saturate(150%);
        backdrop-filter: blur(16px) saturate(150%);
      }
      html[data-skin="liquidglass"] .sully-liquidglass-settings button:not([class*="bg-red"]):not([class*="bg-emerald"]):not([class*="bg-violet"]):not([class*="bg-blue"]) {
        background-color: rgba(255, 255, 255, 0.10);
        border-color: rgba(255, 255, 255, 0.16);
      }
      /* Echoes 只让 Chrome 用玻璃；世界正文、档案内容和用户自定义世界主题不覆盖。 */
      html[data-skin="liquidglass"] .echoes-root > header,
      html[data-skin="liquidglass"] .echoes-root > nav,
      html[data-skin="liquidglass"] .echoes-root > div[class*="border-t"] {
        -webkit-backdrop-filter: blur(24px) saturate(175%);
        backdrop-filter: blur(24px) saturate(175%);
      }
      /* 系统通用 Modal：内容卡片采用浅色玻璃，不把正文强行染成黑底。 */
      html[data-skin="liquidglass"] .sully-global-modal-card {
        background: rgba(42, 42, 46, 0.78) !important;
        color: rgba(255, 255, 255, 0.92) !important;
        border-color: rgba(255, 255, 255, 0.18) !important;
        -webkit-backdrop-filter: blur(32px) saturate(180%);
        backdrop-filter: blur(32px) saturate(180%);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.16);
      }
      html[data-skin="liquidglass"] .sully-global-modal-card h3,
      html[data-skin="liquidglass"] .sully-global-modal-card p,
      html[data-skin="liquidglass"] .sully-global-modal-card span,
      html[data-skin="liquidglass"] .sully-global-modal-card label {
        color: rgba(255, 255, 255, 0.88) !important;
      }
      @media (prefers-reduced-motion: reduce) {
        html[data-skin="liquidglass"] .sully-lg-surface,
        html[data-skin="liquidglass"] .sully-lg-pill,
        html[data-skin="liquidglass"] .sully-lg-chrome {
          transition: none !important;
        }
        html[data-skin="liquidglass"] .sully-lg-modal { animation: none !important; }
      }
      /* 低性能设备/低电量模式由 JS 加 .sully-lg-lite，主动降低模糊半径与阴影。 */
      html[data-skin="liquidglass"].sully-lg-lite {
        --lg-blur: 14px;
        --lg-saturate: 135%;
      }
      html[data-skin="liquidglass"].sully-lg-lite .sully-lg-surface,
      html[data-skin="liquidglass"].sully-lg-lite .sully-lg-pill {
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18) !important;
      }

      html, body, #root {
        width: 100%;
        min-height: var(--app-height, 100lvh);
        height: var(--app-height, 100lvh);
      }
      body {
        background-color: #0f1115;
        margin: 0;
        overflow: hidden;
        /* Critical: Prevent browser back/forward swipe navigation AND vertical rubber-banding */
        overscroll-behavior: none;
        /* Prevent text selection to feel like an app */
        user-select: none;
        -webkit-user-select: none;
        height: var(--app-height);
        min-height: var(--app-height);
        width: 100vw;
        font-family: var(--app-font);
      }
      /* 顶部时钟/电量条被隐藏时（外观开关或平台默认，由 PhoneShell 切换 .sully-statusbar-hidden），
         chrome-top 不再需要那 1.5rem 状态栏预留，退化成 safe-top，
         避免用 --chrome-top 让位的顶栏（交换日记/彼方/剧场等）顶部多留空白。 */
      html.sully-statusbar-hidden {
        --chrome-top: var(--safe-top);
      }
      /* 紧凑显示：时间/电量嵌入安全区左右两侧，App 顶栏从安全区底部开始。
         无刘海设备仍至少留 1.5rem 给时间栏；有灵动岛时不把按钮顶进遮挡区。 */
      html.sully-statusbar-compact {
        --chrome-top: max(var(--safe-top), 1.5rem);
      }
      body.ios-standalone {
        min-height: var(--app-height);
        height: var(--app-height);
        overscroll-behavior-y: auto;
        overscroll-behavior-x: none;
      }
      body.ios-standalone #root {
        min-height: var(--app-height);
        height: var(--app-height);
      }
      /* Global scroll behavior fix */
      .no-overscroll {
        overscroll-behavior: none;
      }
      .overscroll-contain {
        overscroll-behavior: contain;
      }
      /* Re-enable selection for inputs */
      input, textarea {
        user-select: text;
        -webkit-user-select: text;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      /* 默认细滚动条：盖掉浏览器又粗又灰的原生滚动条（.no-scrollbar 仍可隐藏） */
      *::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      *::-webkit-scrollbar-track {
        background: transparent;
      }
      *::-webkit-scrollbar-thumb {
        background: rgba(140, 140, 160, 0.3);
        border-radius: 999px;
      }
      *::-webkit-scrollbar-thumb:hover {
        background: rgba(140, 140, 160, 0.5);
      }
      /* 阅读器细滚动条（明暗主题通用，半透明） */
      .vr-reader-scroll {
        scrollbar-width: thin;
        scrollbar-color: rgba(140,140,140,0.35) transparent;
      }
      .vr-reader-scroll::-webkit-scrollbar {
        width: 5px;
      }
      .vr-reader-scroll::-webkit-scrollbar-track {
        background: transparent;
      }
      .vr-reader-scroll::-webkit-scrollbar-thumb {
        background: rgba(140,140,140,0.35);

      .vr-reader-scroll::-webkit-scrollbar-thumb:hover {
        background: rgba(140,140,140,0.55);

      input:focus, textarea:focus, select:focus {

      /* Utility for Safe Area —— 统一引用单一来源变量 */
      .pb-safe {

      /* 软键盘弹出时（iosStandalone 在 body 上挂 .ios-keyboard-open），收掉底部给 home 条留的 safe 间隙，
         让聊天输入栏直接贴住键盘：① 外壳容器不再把底边钉在 safe 上方，铺到可视区底；② 输入栏收掉自己的 pb-safe 白条。

      .sully-chat-inputbar {
        transition: padding-bottom 0.18s ease-out;
      }
      body.ios-keyboard-open .sully-shell-content {
        bottom: 0 !important;

      body.ios-keyboard-open .sully-chat-inputbar {
        padding-bottom: 0;

      /* 通话页：键盘弹起时收起大头像英雄区（约 300px），把可视区让给消息列表 + 输入框。

      .sully-call-hero {
        transition: max-height 0.2s ease-out, opacity 0.2s ease-out, padding 0.2s ease-out;
        max-height: 420px;

      body.ios-keyboard-open .sully-call-hero {

        opacity: 0;
        padding-top: 0;
        padding-bottom: 0;
